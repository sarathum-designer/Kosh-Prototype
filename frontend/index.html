<script>
/* Self-hosted bridge: gives the front end the same `claude.use()` surface it has inside a Claude artifact,
   backed by the Kosh API. Inside an artifact this file is not loaded. */
(function(){
  if (window.claude) return;
  function sample(input, opts){
    opts = opts || {};
    return fetch("/api/sample", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({input:input}), signal:opts.signal})
      .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw {code:j.error||"upstream_error", message:j.message||"error"}; return j; }); })
      .then(function(j){ if(opts.onText) opts.onText({text:j.text, delta:j.text}); return {text:j.text, truncated:false, modelTierApplied:"default"}; },
            function(e){ if(e && e.name==="AbortError") throw {code:"cancelled"}; throw e && e.code ? e : {code:"upstream_error", message:String(e)}; });
  }
  sample.json = function(input, opts){ return sample(input, opts).then(function(r){ var m=r.text.match(/[\[{][\s\S]*[\]}]/); if(!m) throw {code:"invalid_json", text:r.text}; return JSON.parse(m[0]); }); };
  var downloads = { save: function(req){ var blob = req.data instanceof Blob ? req.data : new Blob([req.data], {type:"text/markdown"}); var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=req.filename; document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();}, 1000); return Promise.resolve({status:"saved"}); } };
  window.claude = { use: function(name){ return Promise.resolve(name==="sample" ? sample : name==="downloads" ? downloads : null); } };
})();
</script>

<body>
<title>Kosh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a dark product shell. Floating pill nav on top, one wide working sheet, big soft-cornered cards on near-black, radial glows. Kosh palette: ink ground, vermilion accent, indigo second, paper text. */
:root{
  --paper:#0E0D0B;--paper-raised:#1C1A16;--paper-sunk:#14130F;--card2:#24211C;
  --ink:#F1ECE2;--ink-muted:#A49E92;--line:#2E2B25;--line-strong:#4A463E;
  --vermilion:#F05A3E;--on-vermilion:#12110E;--vermilion-text:#FF8166;--vermilion-wash:#3A1A12;
  --verified:#63BC90;--conflict:#E2A63E;--stale:#8E897E;--indigo:#8FA3E0;--indigo-deep:#34457A;--focus:#F1ECE2;
  --sans:"Urbanist","Geist",system-ui,sans-serif;--serif:"Urbanist",system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --r-sm:12px;--r-md:24px;--r-lg:32px;--r-xl:40px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--sans);margin:0;
  background-image:radial-gradient(60% 40% at 85% -5%,rgba(240,90,62,.20),transparent 70%),radial-gradient(50% 40% at -5% 30%,rgba(143,163,224,.12),transparent 70%);background-attachment:fixed}
a{color:var(--vermilion-text)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
/* shell */
.topbar{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));z-index:15;margin:12px auto 0;max-width:1240px;padding-inline:16px}
.pill{display:flex;align-items:center;gap:16px;background:rgba(18,17,14,.82);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:300px;padding:10px 10px 10px 22px}
.pill svg.wm{width:76px;height:auto;flex:none;color:var(--ink)}
.pill nav{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.pill nav::-webkit-scrollbar{display:none}
nav button{all:unset;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:300px;font:500 14px/1 var(--sans);color:var(--ink-muted)}
nav button:hover{color:var(--ink);background:rgba(255,255,255,.05)}
nav button[aria-current="page"]{color:var(--on-vermilion);background:var(--vermilion)}
nav button[aria-current="page"] .n{color:var(--on-vermilion);opacity:.7}
nav button:focus-visible{outline:2px solid var(--focus)}
nav .n{display:none}
.pill .cta{flex:none}
#navm,.side,.mobilebar{display:none}
main{margin:0 auto;max-width:1240px;padding-block:40px 64px;padding-inline:clamp(16px,4vw,40px);min-width:0}
.foot{max-width:1240px;margin:0 auto;padding:24px clamp(16px,4vw,40px) 48px;font:400 12px/1.5 var(--mono);color:var(--ink-muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line)}
/* type */
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:500 14px/1 var(--sans);color:var(--ink-muted)}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--vermilion);box-shadow:0 0 12px var(--vermilion)}
.drawer .eyebrow::before,.brief .eyebrow::before,.kpi .eyebrow::before{display:none}
h1{font:500 clamp(40px,6vw,76px)/1.0 var(--sans);margin:14px 0 14px;letter-spacing:-.03em;text-wrap:balance;max-width:16ch}
h1 em{font-style:normal;color:var(--vermilion)}
h2{font:500 26px/1.15 var(--sans);letter-spacing:-.015em;margin:0 0 4px}
h3{font:600 17px/1.3 var(--sans);margin:0}
p{margin:0}
.lede{max-width:62ch;color:var(--ink-muted);font-size:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.section{display:flex;flex-direction:column;gap:20px;margin-top:40px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{background:var(--paper-raised);border:1px solid rgba(255,255,255,.05);border-radius:var(--r-lg);padding:28px;min-width:0}
.muted{color:var(--ink-muted)}
.mono{font-family:var(--mono)}
.small{font-size:14px}
.src{font:400 12px/1.45 var(--mono);color:var(--ink-muted)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;font:600 15px/1 var(--sans);padding:14px 22px;border-radius:300px;border:1px solid var(--vermilion);background:transparent;color:var(--ink);cursor:pointer;transition:transform .15s,background .15s}
.btn:hover{background:rgba(240,90,62,.08)}
.btn--primary{background:var(--vermilion);color:var(--on-vermilion);box-shadow:0 0 0 1px var(--vermilion),0 8px 28px -8px rgba(240,90,62,.65)}
.btn--primary:hover{background:var(--vermilion);transform:translateY(-1px)}
.btn--quiet{border-color:transparent;color:var(--vermilion-text);padding-inline:6px}
.btn--quiet:hover{background:transparent;text-decoration:underline}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 13px/1 var(--sans);padding:8px 13px;border-radius:300px;border:1px solid var(--line-strong);background:rgba(255,255,255,.03);white-space:nowrap;color:var(--ink)}
.chip--ok{color:var(--verified);border-color:rgba(99,188,144,.45)} .chip--warn{color:var(--conflict);border-color:rgba(226,166,62,.45)} .chip--no{color:var(--vermilion-text);border-color:rgba(255,129,102,.45)} .chip--none{color:var(--stale)}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--ink-muted)}
button.chip[data-suggest]{white-space:normal;text-align:left;line-height:1.3}
/* Source Dot */
.dot{all:unset;cursor:pointer;display:inline-block;width:8px;height:8px;border-radius:999px;background:var(--vermilion);margin-left:5px;vertical-align:.35em;flex:none;box-shadow:0 0 8px rgba(240,90,62,.7)}
.dot:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.dot--conflict{background:linear-gradient(90deg,var(--conflict) 50%,transparent 50%);box-shadow:inset 0 0 0 1.5px var(--conflict)}
.dot--stale{background:transparent;box-shadow:inset 0 0 0 1.5px var(--stale)}
.dot--verified{background:var(--verified);box-shadow:0 0 8px rgba(99,188,144,.6)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font:400 13px/1 var(--sans);color:var(--ink-muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{vertical-align:middle;cursor:default;margin:0}
/* forms */
label.f{display:flex;flex-direction:column;gap:8px;font:500 14px/1.3 var(--sans);min-width:0;color:var(--ink-muted)}
input[type=text],input[type=number],select,textarea{background:var(--paper-sunk);border:1px solid var(--line-strong);border-radius:16px;padding:13px 16px;width:100%;min-width:0;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--vermilion);outline:none;box-shadow:0 0 0 3px rgba(240,90,62,.18)}
textarea{resize:vertical;min-height:110px;line-height:1.5}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;gap:8px;align-items:center;font:500 14px/1 var(--sans);border:1px solid var(--line-strong);border-radius:300px;padding:10px 15px;background:transparent;cursor:pointer}
.checks label:has(input:checked){border-color:var(--vermilion);background:rgba(240,90,62,.10)}
.checks input{accent-color:var(--vermilion)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
/* table */
.tablewrap{overflow-x:auto;border:1px solid rgba(255,255,255,.05);border-radius:var(--r-lg);background:var(--paper-raised)}
table{border-collapse:collapse;width:100%;min-width:780px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:16px 18px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 13px/1.3 var(--sans);color:var(--ink-muted);background:transparent;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td .big{font:500 19px/1.2 var(--mono);letter-spacing:-.01em;white-space:nowrap}
td.city{font-weight:600;font-size:17px}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.06);position:relative;margin-top:8px;min-width:120px}
.bar i{position:absolute;top:0;bottom:0;border-radius:999px;background:var(--vermilion);box-shadow:0 0 14px rgba(240,90,62,.6)}
.barrow{display:grid;grid-template-columns:150px minmax(0,1fr) 160px;gap:14px;align-items:center}
@media (max-width:600px){.barrow{grid-template-columns:1fr auto;gap:4px 12px}.barrow .bar{grid-column:1/-1;grid-row:2;min-width:0}}
.verdict{display:flex;flex-direction:column;gap:6px}
/* answers */
.answer{white-space:normal;max-width:72ch}
.answer p+p,.answer ul{margin-top:10px}
.answer ul{padding-left:20px;margin-bottom:0}
.cite{all:unset;cursor:pointer;font:500 11px/1 var(--mono);padding:3px 7px;border-radius:300px;background:var(--vermilion-wash);color:var(--vermilion-text);margin:0 1px;vertical-align:1px}
.cite:focus-visible{outline:2px solid var(--focus)}
.msg{display:flex;flex-direction:column;gap:8px;padding:20px 24px;border-radius:var(--r-md);background:var(--paper-raised);margin-top:12px}
.msg.user{background:transparent;border:1px solid var(--line-strong)}
.msg .who{font:500 12px/1 var(--mono);color:var(--ink-muted);text-transform:uppercase;letter-spacing:.06em}
.msg.user .body{font-weight:500}
.askbar{display:flex;gap:10px;align-items:flex-end;background:var(--paper-raised);border-radius:var(--r-lg);padding:12px;border:1px solid var(--line)}
.askbar textarea{min-height:56px;border:0;background:transparent}
.askbar textarea:focus{box-shadow:none}
/* conflicts */
.xgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:18px}
.xcell{background:var(--card2);padding:18px;display:flex;flex-direction:column;gap:6px;min-width:0;border-radius:var(--r-md)}
.xcell .v{font:500 28px/1.1 var(--mono);letter-spacing:-.02em;overflow-wrap:anywhere;color:var(--ink)}
/* drawer */
.drawer{position:fixed;right:12px;top:12px;bottom:12px;width:min(440px,calc(100% - 24px));background:var(--paper-raised);border:1px solid var(--line-strong);border-radius:var(--r-lg);padding:calc(28px + env(safe-area-inset-top,0px)) 28px 28px;z-index:20;display:flex;flex-direction:column;gap:14px;overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.8)}
.drawer .v{font:500 34px/1.1 var(--mono);letter-spacing:-.02em}
.drawer .card{background:var(--card2);border-radius:var(--r-md)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:19}
.banner{display:flex;gap:12px;align-items:flex-start;padding:16px 20px;border:1px solid rgba(143,163,224,.35);background:rgba(143,163,224,.07);border-radius:var(--r-md);font-size:14px;color:var(--ink)}
/* KPIs: hero cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{border-radius:var(--r-lg);padding:24px;background:var(--paper-raised);border:1px solid rgba(255,255,255,.05);position:relative;overflow:hidden}
.kpi .v{font:500 40px/1.05 var(--mono);letter-spacing:-.03em;margin:10px 0 6px}
.kpi:nth-child(2){background:var(--vermilion);color:var(--on-vermilion)}
.kpi:nth-child(2) .muted,.kpi:nth-child(2) .src{color:rgba(18,17,14,.72)}
.kpi:nth-child(4){background:radial-gradient(95% 75% at 0% 100%,var(--indigo-deep) 0%,var(--paper-raised) 100%)}
.prov{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:20px 24px;border-radius:var(--r-md);background:var(--paper-raised);margin-top:10px}
.brief{background:var(--paper-raised);border:1px solid rgba(255,255,255,.05);border-radius:var(--r-xl);padding:clamp(22px,4vw,48px);max-width:880px}
.brief h1{max-width:none}
.brief h2{margin-top:28px}
.brief .verdictline{font:500 26px/1.25 var(--sans);margin:10px 0 0;color:var(--vermilion-text)}
.thinking{font:400 13px/1.4 var(--mono);color:var(--ink-muted)}
@media (max-width:760px){.pill .cta{display:none}.pill{padding-left:16px}main{padding-block:28px 48px}}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .3s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}

/* ---- motion (Bombon-style) ---- */
.pill nav{position:relative}
.navind{position:absolute;top:0;left:0;height:100%;border-radius:300px;background:var(--vermilion);box-shadow:0 0 22px -4px rgba(240,90,62,.8);transition:transform .5s cubic-bezier(.2,.8,.2,1),width .5s cubic-bezier(.2,.8,.2,1);z-index:0;pointer-events:none}
nav button{position:relative;z-index:1;transition:color .3s}
nav button[aria-current="page"]{background:transparent}
.orb{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:-1;opacity:.55}
.orb.o1{width:460px;height:460px;right:-120px;top:-120px;background:rgba(240,90,62,.35)}
.orb.o2{width:420px;height:420px;left:-160px;top:38%;background:rgba(143,163,224,.22)}
.card,.kpi,.prov,.xcell,.msg{transition:transform .45s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .45s}
.card,.kpi,.prov{position:relative;overflow:hidden}
.card::after,.kpi::after,.prov::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(240,90,62,.12),transparent 60%)}
.card:hover::after,.kpi:hover::after,.prov:hover::after{opacity:1}
.kpi:hover,.xcell:hover,.prov:hover{transform:translateY(-4px)}
.kpi:hover{box-shadow:0 24px 50px -24px rgba(0,0,0,.9)}
.kpi:nth-child(2)::after{background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.25),transparent 60%)}
.btn--primary{transition:transform .25s,box-shadow .35s}
.btn--primary:hover{box-shadow:0 0 0 1px var(--vermilion),0 10px 40px -6px rgba(240,90,62,.9)}
.btn:active{transform:scale(.97)}
.checks label,.chip{transition:border-color .25s,background-color .25s,transform .25s}
.checks label:hover,button.chip:hover{transform:translateY(-1px)}
.bar i{transition:left .9s cubic-bezier(.2,.8,.2,1),width .9s cubic-bezier(.2,.8,.2,1)}
.dot{transition:transform .25s}
.dot:hover{transform:scale(1.6)}
.cite{transition:background-color .2s}
.cite:hover{background:var(--vermilion);color:var(--on-vermilion)}
@media (prefers-reduced-motion:no-preference){
  .orb.o1{animation:float1 14s ease-in-out infinite}
  .orb.o2{animation:float2 18s ease-in-out infinite}
  @keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,40px)}}
  @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,-50px)}}
  .up{opacity:0;transform:translateY(40px)}
  .up.in{opacity:1;transform:none;transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1)}
  .drawer{animation:slidein .45s cubic-bezier(.2,.8,.2,1)}
  .scrim{animation:fadein .3s ease}
  @keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .msg{animation:msgin .5s cubic-bezier(.2,.8,.2,1)}
  @keyframes msgin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .eyebrow::before{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 6px var(--vermilion)}50%{box-shadow:0 0 18px 2px var(--vermilion)}}
  .thinking::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
}
</style>

<script id="kosh-data" type="application/json">/*__DATA__*/</script>
<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById("kosh-data").textContent);
var FACT = {}, SRC = {}, CONF_OF = {}, CITY = {}, STATE = {};
D.facts.forEach(function(f){FACT[f.id]=f;});
D.sources.forEach(function(s){SRC[s.id]=s;});
D.conflicts.forEach(function(x){x.facts.forEach(function(id){CONF_OF[id]=x.id;});});
D.cities.forEach(function(c){CITY[c.id]=c;});
D.states.forEach(function(s){STATE[s.id]=s;});
var A = D.assumptions;

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function $(sel,el){return (el||document).querySelector(sel);}
function find(subject,metric){return D.facts.filter(function(f){return f.subject===subject&&f.metric===metric;});}
function first(subject,metric){return find(subject,metric)[0]||null;}
function factStatus(f){
  if(CONF_OF[f.id]) return "conflict";
  var s=SRC[f.source]; if(!s) return "stale";
  if(s.kind==="vendor") return "stale";
  var y=parseInt(String(f.as_of).slice(0,4),10), m=parseInt(String(f.as_of).slice(5,7)||"6",10);
  var months=(2026-y)*12+(10-m); if(months>12) return "stale";
  return "sourced";
}
var STATUS_WORD={sourced:"Sourced",conflict:"Sources disagree",stale:"Single source or dated",verified:"Verified"};
function dot(fid){var f=FACT[fid]; if(!f) return ""; var st=factStatus(f); var s=SRC[f.source];
  return '<button class="dot dot--'+st+'" data-fact="'+fid+'" aria-label="'+esc(STATUS_WORD[st]+": "+(s?s.publisher:"")+", "+f.as_of)+'" title="'+esc((s?s.publisher:"")+" · "+f.as_of)+'"></button>';}
function srcDot(sid){var s=SRC[sid]; if(!s) return ""; return '<button class="dot'+(s.kind==="vendor"?" dot--stale":"")+'" data-src="'+sid+'" aria-label="Source: '+esc(s.publisher)+'" title="'+esc(s.publisher+" · "+s.date)+'"></button>';}
function srcLine(fid){var f=FACT[fid]; if(!f) return ""; var s=SRC[f.source]; return esc(s.publisher)+" · "+esc(f.as_of)+(f.definition?" · "+esc(f.definition):"");}
function fmtVal(f){ if(typeof f.value==="number"){ return f.value.toLocaleString("en-IN"); } return esc(f.value); }
function safeGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}

/* ---------- cost model ---------- */
function rentFor(cityId){
  if(cityId==="hyderabad"){var f=first("hyderabad","Office rent, SBD"); return {lo:70,hi:95,fid:f&&f.id,note:"Hyderabad SBD range"};}
  if(cityId==="bengaluru"){var g=first("bengaluru","Office rent (single transaction)"); return {lo:A.rent_fallback.low,hi:113,fid:g&&g.id,note:"Tier-1 range up to a recorded ORR deal at ₹113"};}
  var fb=first("india","Grade A office rent, tier-1 cities");
  if(CITY[cityId]&&CITY[cityId].tier===2) return null;
  return {lo:A.rent_fallback.low,hi:A.rent_fallback.high,fid:fb&&fb.id,note:"No city figure; tier-1 vendor range"};
}
function costFor(cityId,p){
  var sal=first(cityId,"Software engineer median salary"); var rent=rentFor(cityId);
  if(!sal||!rent) return null;
  var heads=Math.max(1,Number(p.y1)||1);
  var payroll=heads*sal.num*(1+A.statutory_load.value)/100; // ₹ crore
  var sqft=heads*A.sqft_per_seat.value;
  var rentLo=sqft*rent.lo*12/1e7, rentHi=sqft*rent.hi*12/1e7;
  var eorLo=0,eorHi=0;
  if(p.model==="eor"){eorLo=heads*99*12*A.inr_per_usd.value/1e7; eorHi=heads*599*12*A.inr_per_usd.value/1e7;}
  return {sal:sal,rent:rent,payroll:payroll,rentLo:rentLo,rentHi:rentHi,eorLo:eorLo,eorHi:eorHi,lo:payroll+rentLo+eorLo,hi:payroll+rentHi+eorHi};
}
function cr(n){return "₹"+(n>=10?n.toFixed(0):n.toFixed(1))+" cr";}
function usdm(n){return "US$"+(n*1e7/A.inr_per_usd.value/1e6).toFixed(1)+"M";}

/* ---------- incentive engine ---------- */
function evalState(st,p,cityId){
  var r=st.rules||{}, reasons=[], verdict="likely";
  function down(v){var order={likely:0,check:1,no:2,none:3}; if(order[v]>order[verdict]) verdict=v;}
  if(r.no_policy){ return {verdict:"none",reasons:["No notified GCC policy to claim from today. "+st.watch]}; }
  if(r.ownership && p.model!=="own"){ down("no"); reasons.push("Only wholly owned units qualify. Your plan uses "+(p.model==="bot"?"a BOT partner":"an EOR")+"."); }
  if(r.min_employees){ if(p.y1<r.min_employees && p.y3>=r.min_employees){down("check"); reasons.push("Needs "+r.min_employees+"+ employees. You reach that in year 3, not year 1.");} else if(p.y3<r.min_employees){down("no"); reasons.push("Needs "+r.min_employees+"+ employees; your plan stays below that.");} }
  if(r.min_employees_noida){ var th=(cityId==="ncr")?r.min_employees_noida:r.min_employees_other; if(p.y3<th){down("check"); reasons.push("Needs "+th+" staff (or a capital threshold) in "+(cityId==="ncr"?"Noida/Ghaziabad":"UP outside Noida")+". Your year-3 plan is "+p.y3+".");} }
  if(r.parent_rank && r.parent_rank.indexOf(p.rank)<0){ down("no"); reasons.push("Parent must be Fortune 1000 or Forbes G2000."); }
  if(r.excluded_functions){ var bad=p.functions.filter(function(f){return f==="support"||f==="sales";}); if(bad.length){ down(p.functions.length===bad.length?"no":"check"); reasons.push("BPO, call-centre and pure sales units are excluded. Keep those functions out of the claiming unit."); } }
  if(r.first_n){ down("check"); reasons.push("The richest incentives go to the first "+r.first_n+" large GCCs. Ask the state how many slots are left."); }
  if(r.dated){ down("check"); reasons.push("Scheme figures date from Feb 2024 and run to Mar 2027. Confirm they still apply."); }
  if(st.id==="KA" && cityId==="bengaluru"){ reasons.push("The 'Beyond Bengaluru' package does not apply inside Bengaluru."); }
  if(p.model==="eor" && verdict!=="no"){ down("check"); reasons.push("On an EOR your staff sit on the provider's payroll. Incentives are normally claimed by your own registered unit, so count on them only after you incorporate. (Kosh reading of the policies, not legal advice.)"); }
  if(st.status.indexOf("not verified")>=0||st.status.indexOf("pending")>=0){ down("check"); reasons.push(st.watch); }
  reasons=reasons.filter(function(v,i,a){return a.indexOf(v)===i;});
  if(!reasons.length) reasons.push("Your plan meets the published thresholds.");
  return {verdict:verdict,reasons:reasons};
}
function statesFor(cityId){var c=CITY[cityId]; var out=[STATE[c.state]]; if(c.alt_state) out.push(STATE[c.alt_state]); return out.filter(Boolean);}
var VERDICT={likely:["chip--ok","Likely eligible"],check:["chip--warn","Check first"],no:["chip--no","Not eligible"],none:["chip--none","No policy yet"]};
function verdictChip(v){var x=VERDICT[v]; return '<span class="chip '+x[0]+'">'+x[1]+'</span>';}
function bestVerdict(cityId,p){var order={likely:0,check:1,none:2,no:3},best=null; statesFor(cityId).forEach(function(st){var e=evalState(st,p,cityId); if(!best||order[e.verdict]<order[best.verdict]) best={verdict:e.verdict,state:st,e:e};}); return best;}

var RULES="You are Kosh, a neutral record of India's Global Capability Centre (GCC) ecosystem. Answer the user's question using ONLY the dataset below and the user's plan.\nRules:\n- Every figure you state must be followed by its fact id in square brackets, like [F12]. Cite states as [S:KA] style is NOT allowed; cite the state's source id instead, like [S16]. Cite a disagreement as [X3].\n- When sources disagree, give the range and say why (from the conflict's explanation). Do not pick a winner silently.\n- If the dataset does not contain the answer, say plainly that Kosh has no verified figure for it, and name what kind of source would settle it. Never use outside knowledge for numbers.\n- When a source sells GCC services, mention it if it matters to the answer.\n- Never rank, recommend or praise a service provider. You may list providers and their public claims, alphabetically.\n- Write plainly: short sentences, no headings, at most 170 words. Use '- ' bullets only for lists of 3+ items. No preamble.\n\nDATASET (facts are [id, subject, metric, value, unit, source, as_of, definition]):\n";
function renderAnswer(text){
  var t=esc(text);
  t=t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  t=t.replace(/\[((?:F|S|X)\d+(?:\s*,\s*(?:F|S|X)\d+)*)\]/g,function(m,ids){return ids.split(/\s*,\s*/).map(function(id){
    if(id[0]==="F"&&FACT[id]) return '<button class="cite" data-fact="'+id+'">'+id+'</button>';
    if(id[0]==="S"&&SRC[id]) return '<button class="cite" data-src="'+id+'">'+id+'</button>';
    if(id[0]==="X") return '<button class="cite" data-conflict="'+id+'">'+id+'</button>';
    return '<span class="cite" title="Not in the dataset">'+id+'?</span>';}).join("");});
  var lines=t.split(/\n/), out=[], inList=false;
  lines.forEach(function(l){ if(/^\s*[-•]\s+/.test(l)){ if(!inList){out.push("<ul>");inList=true;} out.push("<li>"+l.replace(/^\s*[-•]\s+/,"")+"</li>"); } else { if(inList){out.push("</ul>");inList=false;} if(l.trim()) out.push("<p>"+l+"</p>"); } });
  if(inList) out.push("</ul>"); return out.join("");
}
function offlineAnswer(q){var words=q.toLowerCase().split(/[^a-z0-9]+/).filter(function(w){return w.length>3;});

  if(!hits.length) return "Kosh's assistant is not available in this view, and no stored figure matches those words. Try the city comparison or the list of disagreements.";
  return "Kosh's assistant is not available in this view. These stored figures match your question:\n"+hits.map(function(f){return "- "+f.metric+(f.subject!=="india"?" ("+(CITY[f.subject]?CITY[f.subject].name:f.subject)+")":"")+": "+(typeof f.value==="number"?f.value.toLocaleString("en-IN"):f.value)+" "+f.unit+" ["+f.id+"]";}).join("\n");}

async function ask(q){
  q=q.trim(); if(!q||asking) return; chat.push({role:"user",content:q}); render();
  var live=$("#live"); live.innerHTML='<div class="msg"><div class="who">Kosh</div><div class="thinking">Checking the dataset…</div></div>';
  var sample=null; try{sample=await window.claude.use("sample");}catch(e){sample=null;}
  if(!sample){chat.push({role:"assistant",content:offlineAnswer(q)}); render(); return;}
  asking=new AbortController(); $("#stopBtn").hidden=false; $("#askBtn").disabled=true;
  var turns=[{role:"user",content:RULES+datasetForPrompt()+"\n\nUSER'S PLAN:\n"+planSummary()+"\n\nAnswer the questions that follow."}];
  chat.forEach(function(m){turns.push({role:m.role,content:m.content});});
  if(turns.length>13) turns=[turns[0]].concat(turns.slice(-11));
  try{
    var res=await sample(turns,{cache:false,signal:asking.signal,onText:function(u){live.innerHTML='<div class="msg"><div class="who">Kosh</div><div class="body answer">'+renderAnswer(u.text)+'</div></div>';}});
    chat.push({role:"assistant",content:res.text,note:res.truncated?"Cut short. Ask for less at a time.":""});
  }catch(e){
    var code=e&&e.code;
    if(code==="cancelled"){ if(e.text) chat.push({role:"assistant",content:e.text,note:"Stopped."}); else chat.pop(); }
    else if(code==="not_granted"||code==="sampling_disabled"||code==="not_declared"||code==="capability_disabled"){chat.push({role:"assistant",content:offlineAnswer(q)});}
    else if(code==="rate_limited"){chat.push({role:"assistant",content:e.text||"Too many questions at once. Wait a minute and ask again.",note:"Rate limited."});}
    else if(code==="refused"){chat.push({role:"assistant",content:"Kosh can't answer that one. Try asking about GCC cities, costs, incentives or providers."});}
    else {chat.push({role:"assistant",content:e&&e.text?e.text:"The answer was interrupted. Ask again.",note:"Interrupted."});}
  }
  asking=null; render();
}

function render(){
  $("#nav").innerHTML=navHTML(); $("#navm").innerHTML=navHTML();
  $("#foot").textContent="Prototype · dataset "+D.meta.as_of+" · "+D.facts.length+" figures · "+D.sources.length+" sources";
  var m=$("#main");
  m.innerHTML={plan:vPlan,cities:vCities,incentives:vIncentives,ask:vAsk,conflicts:vConflicts,providers:vProviders,brief:vBrief,sources:vSources}[view]();
  wire();
  motion();
}
function wire(){
  var b;
  if((b=$("#savePlan"))) b.onclick=function(){readForm(); render(); var s=$("#planStatus"); if(s) s.textContent="Updated.";};
  if((b=$("#resetPlan"))) b.onclick=function(){plan=JSON.parse(JSON.stringify(EXAMPLE_PLAN)); plan._example=true; planIsExample=true; savePlan(); render();};
  if((b=$("#readPlan"))) b.onclick=readPlanAI;
  var f=$("#askForm"); if(f){ f.onsubmit=function(e){e.preventDefault(); var v=$("#askBox").value; ask(v);}; $("#askBox").onkeydown=function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault(); ask(this.value);}}; $("#stopBtn").onclick=function(){if(asking) asking.abort();}; }
  [].forEach.call(document.querySelectorAll("[data-suggest]"),function(x){x.onclick=function(){ask(x.getAttribute("data-suggest"));};});
  [].forEach.call(document.querySelectorAll("[data-cat]"),function(x){x.onclick=function(){provFilter=x.getAttribute("data-cat"); render();};});
  if((b=$("#introBtn"))) b.onclick=function(){introSent=true; render();};
  if((b=$("#briefAIBtn"))) b.onclick=writeBriefAI;
  if((b=$("#dlBrief"))) b.onclick=async function(){var st=$("#briefStatus"); var dl=null; try{dl=await window.claude.use("downloads");}catch(e){}
    if(!dl){st.textContent="Downloads aren't available here. Use Copy text instead."; return;}
    try{await dl.save({filename:(plan.company||"kosh").replace(/[^a-z0-9]+/gi,"-").toLowerCase()+"-india-brief.md",data:briefMarkdown()}); st.textContent="Saved.";}catch(e){st.textContent=e&&e.code==="declined"?"Download cancelled.":"Couldn't save the file. Use Copy text instead.";}};
  if((b=$("#copyBrief"))) b.onclick=function(){var st=$("#briefStatus"); var t=briefMarkdown(); try{navigator.clipboard.writeText(t).then(function(){st.textContent="Copied.";},function(){fallbackCopy(t); st.textContent="Text selected. Press Ctrl+C or Cmd+C.";});}catch(e){fallbackCopy(t); st.textContent="Text selected. Press Ctrl+C or Cmd+C.";}};
}
function fallbackCopy(t){var ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); setTimeout(function(){ta.remove();},4000);}
async function readPlanAI(){
  var st=$("#planStatus"), txt=$("#planText").value.trim(); if(!txt){st.textContent="Write a sentence or two about your plan first."; return;}
  var sample=null; try{sample=await window.claude.use("sample");}catch(e){}
  if(!sample){st.textContent="The assistant isn't available here. Fill in the form instead."; return;}
  st.textContent="Reading your plan…"; $("#readPlan").disabled=true;
  var prompt="Extract a GCC setup plan from the text below. Reply with only a JSON object with these keys: company (string), revenue (one of lt100m, 100m-1b, gt1b, or null), rank (one of g2000, f1000, other, or null), functions (array from: engineering, data, finance, operations, support, sales), y1 (integer headcount in year 1 or null), y3 (integer headcount in year 3 or null), model (one of eor, bot, own, or null), cities (array from: "+D.cities.map(function(c){return c.id+" ("+c.name+")";}).join(", ")+"), timeline (string or null). Use null when the text doesn't say. Example: {\"company\":\"Acme\",\"revenue\":\"100m-1b\",\"rank\":\"other\",\"functions\":[\"engineering\"],\"y1\":40,\"y3\":120,\"model\":\"eor\",\"cities\":[\"pune\"],\"timeline\":\"2027\"}\n\nTEXT:\n"+txt.slice(0,4000);
  try{var j=await sample.json(prompt,{modelTier:"quick"});
    if(j&&typeof j==="object"){ if(j.company) plan.company=String(j.company); if(j.revenue&&REVS.some(function(r){return r[0]===j.revenue;})) plan.revenue=j.revenue; if(j.rank&&RANKS.some(function(r){return r[0]===j.rank;})) plan.rank=j.rank;
      if(Array.isArray(j.functions)&&j.functions.length) plan.functions=j.functions.filter(function(f){return FUNCS.some(function(x){return x[0]===f;});});
      if(Number(j.y1)>0) plan.y1=Math.round(Number(j.y1)); if(Number(j.y3)>0) plan.y3=Math.max(plan.y1,Math.round(Number(j.y3))); else plan.y3=Math.max(plan.y3,plan.y1);
      if(j.model&&MODELS.some(function(m){return m[0]===j.model;})) plan.model=j.model;
      if(Array.isArray(j.cities)){var cs=j.cities.filter(function(c){return CITY[c];}); if(cs.length) plan.cities=cs;}
      if(j.timeline) plan.timeline=String(j.timeline);
      planIsExample=false; plan._example=false; savePlan(); render(); var s2=$("#planStatus"); if(s2) s2.textContent="Done. Check the fields below and adjust anything Kosh got wrong.";
      var pt=$("#planText"); if(pt) pt.value=txt; }
  }catch(e){ st.textContent=(e&&e.code==="not_granted")?"Allow Kosh to use Claude, or fill in the form.":"Kosh couldn't read that. Fill in the form instead."; $("#readPlan").disabled=false; }
}
render();
})();
</script>
