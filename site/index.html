<title>Kosh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap">
<style>
/* Layout: a ledger. Fixed left index of sections, one working sheet on the right; every number carries a Source Dot. Tokens from the Kosh brand system. */
:root{
  --paper:#F2EEE6;--paper-raised:#FAF8F3;--paper-sunk:#E8E3D8;--ink:#16140F;--ink-muted:#5F5A50;--line:#D9D2C4;--line-strong:#8F897C;
  --vermilion:#E9512F;--on-vermilion:#16140F;--vermilion-text:#B0311B;--vermilion-wash:#F8DDD3;
  --verified:#2B6A4C;--conflict:#93600A;--stale:#6B675E;--indigo:#34457A;--focus:#16140F;
  --sans:"Geist","Inter",system-ui,sans-serif;--serif:"Instrument Serif",Georgia,serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --r-sm:4px;--r-md:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12110E;--paper-raised:#1C1A16;--paper-sunk:#0B0A08;--ink:#F1ECE2;--ink-muted:#A49E92;--line:#2E2B25;--line-strong:#6A655B;
  --vermilion:#F05A3E;--on-vermilion:#12110E;--vermilion-text:#FF8166;--vermilion-wash:#3A1A12;--verified:#63BC90;--conflict:#E2A63E;--stale:#8E897E;--indigo:#8FA3E0;--focus:#F1ECE2;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12110E;--paper-raised:#1C1A16;--paper-sunk:#0B0A08;--ink:#F1ECE2;--ink-muted:#A49E92;--line:#2E2B25;--line-strong:#6A655B;
  --vermilion:#F05A3E;--on-vermilion:#12110E;--vermilion-text:#FF8166;--vermilion-wash:#3A1A12;--verified:#63BC90;--conflict:#E2A63E;--stale:#8E897E;--indigo:#8FA3E0;--focus:#F1ECE2;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--sans);margin:0}
a{color:var(--vermilion-text)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:24px;background:var(--paper)}
.side svg.wm{width:88px;height:auto;display:block}
.side .tag{font:400 12px/1.4 var(--mono);color:var(--ink-muted);margin-top:8px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:var(--r-sm);font:500 14px/1.3 var(--sans);color:var(--ink-muted)}
nav button:hover{color:var(--ink);background:var(--paper-sunk)}
nav button[aria-current="page"]{color:var(--ink);background:var(--paper-raised);box-shadow:inset 0 0 0 1px var(--line)}
nav button:focus-visible{outline:2px solid var(--focus)}
nav .n{font:400 11px/1 var(--mono);color:var(--ink-muted)}
.side .foot{margin-top:auto;font:400 11px/1.5 var(--mono);color:var(--ink-muted)}
main{padding-block:32px 64px;padding-inline:clamp(16px,4vw,48px);min-width:0;max-width:1180px}
.eyebrow{font:500 12px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
h1{font:400 clamp(34px,4.6vw,52px)/1.04 var(--serif);margin:6px 0 10px;text-wrap:balance;letter-spacing:-.005em}
h2{font:600 20px/1.25 var(--sans);letter-spacing:-.015em;margin:0 0 4px}
h3{font:600 15px/1.3 var(--sans);margin:0}
p{margin:0}
.lede{max-width:64ch;color:var(--ink-muted);font-size:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.section{display:flex;flex-direction:column;gap:20px;margin-top:32px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--r-md);padding:20px;min-width:0}
.muted{color:var(--ink-muted)}
.mono{font-family:var(--mono)}
.small{font-size:13px}
.src{font:400 12px/1.45 var(--mono);color:var(--ink-muted)}
.btn{display:inline-flex;align-items:center;gap:8px;font:500 14px/1 var(--sans);padding:11px 16px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--paper-raised);cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn--primary{background:var(--vermilion);border-color:var(--vermilion);color:var(--on-vermilion)}
.btn--primary:hover{filter:brightness(1.04);border-color:var(--vermilion)}
.btn--quiet{border-color:transparent;background:transparent;color:var(--vermilion-text);padding-inline:4px}
.btn[disabled]{opacity:.55;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--sans);padding:6px 9px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--paper-raised);white-space:nowrap}
.chip--ok{color:var(--verified)} .chip--warn{color:var(--conflict)} .chip--no{color:var(--vermilion-text)} .chip--none{color:var(--stale)}
button.chip{cursor:pointer}
button.chip[data-suggest]{white-space:normal;text-align:left;line-height:1.3}
button.chip:hover{border-color:var(--line-strong)}
/* Source Dot */
.dot{all:unset;cursor:pointer;display:inline-block;width:8px;height:8px;border-radius:999px;background:var(--vermilion);margin-left:4px;vertical-align:.35em;flex:none}
.dot:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.dot--conflict{background:linear-gradient(90deg,var(--conflict) 50%,transparent 50%);box-shadow:inset 0 0 0 1.5px var(--conflict)}
.dot--stale{background:transparent;box-shadow:inset 0 0 0 1.5px var(--stale)}
.dot--verified{background:var(--verified)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font:400 12px/1 var(--sans);color:var(--ink-muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend .dot{vertical-align:middle;cursor:default;margin:0}
/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font:500 13px/1.3 var(--sans);min-width:0}
label.f span.h{font-weight:400;color:var(--ink-muted)}
input[type=text],input[type=number],select,textarea{background:var(--paper-raised);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:9px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:96px;line-height:1.5}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;gap:6px;align-items:center;font:400 13px/1 var(--sans);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;background:var(--paper-raised);cursor:pointer}
.checks input{accent-color:var(--vermilion)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper-raised)}
table{border-collapse:collapse;width:100%;min-width:760px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 12px/1.3 var(--sans);color:var(--ink-muted);background:var(--paper-sunk);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td .big{font:500 18px/1.2 var(--mono);letter-spacing:-.01em;white-space:nowrap}
td.city{font-weight:600}
.bar{height:8px;border-radius:999px;background:var(--paper-sunk);position:relative;margin-top:8px;min-width:120px}
.bar i{position:absolute;top:0;bottom:0;border-radius:999px;background:var(--vermilion)}
.barrow{display:grid;grid-template-columns:150px minmax(0,1fr) 150px;gap:12px;align-items:center}
@media (max-width:600px){.barrow{grid-template-columns:1fr auto;gap:4px 12px}.barrow .bar{grid-column:1/-1;grid-row:2;min-width:0}}
.verdict{display:flex;flex-direction:column;gap:6px}
/* answer */
.answer{white-space:normal;max-width:72ch}
.answer p+p,.answer ul{margin-top:10px}
.answer ul{padding-left:20px;margin-bottom:0}
.cite{all:unset;cursor:pointer;font:500 11px/1 var(--mono);padding:2px 5px;border-radius:3px;background:var(--vermilion-wash);color:var(--ink);margin:0 1px;vertical-align:1px}
.cite:focus-visible{outline:2px solid var(--focus)}
.msg{display:flex;flex-direction:column;gap:8px;padding:16px 0;border-bottom:1px solid var(--line)}
.msg .who{font:500 12px/1 var(--mono);color:var(--ink-muted);text-transform:uppercase;letter-spacing:.05em}
.msg.user .body{font-weight:500}
.askbar{display:flex;gap:8px;align-items:flex-end}
.askbar textarea{min-height:52px}
/* conflicts */
.xgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;margin-top:14px}
.xcell{background:var(--paper-sunk);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.xcell .v{font:500 24px/1.1 var(--mono);letter-spacing:-.02em;overflow-wrap:anywhere}
/* drawer */
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--paper-raised);border-left:1px solid var(--line);padding:calc(24px + env(safe-area-inset-top,0px)) 24px 24px;z-index:20;display:flex;flex-direction:column;gap:14px;overflow:auto}
.drawer .v{font:500 30px/1.1 var(--mono);letter-spacing:-.02em}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:19}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:var(--r-md);font-size:13px;color:var(--ink-muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{border-top:2px solid var(--ink);padding-top:10px}
.kpi .v{font:500 30px/1.05 var(--mono);letter-spacing:-.02em;margin:6px 0 4px}
.prov{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:16px 0;border-bottom:1px solid var(--line)}
.brief{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--r-md);padding:clamp(20px,4vw,40px);max-width:820px}
.brief h2{margin-top:24px}
.brief .verdictline{font:400 26px/1.2 var(--serif);margin:8px 0 0}
.thinking{font:400 13px/1.4 var(--mono);color:var(--ink-muted)}
.mobilebar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mobilebar{display:flex;flex-direction:column;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line);padding:12px 16px}
  .mobilebar nav{flex-direction:row;overflow-x:auto;gap:4px}
  .mobilebar nav button{white-space:nowrap}
  main{padding-block:20px 48px}
}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .25s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>

ve amounts not published."},{"id":"MP","name":"Madhya Pradesh","status":"GCC Policy 2025","source":"S21","rules":{},"incentives":["Capex, payroll, upskilling and R&D support"],"watch":"Amounts not published."},{"id":"AP","name":"Andhra Pradesh","status":"IT & GCC Policy 4.0 (2024-29)","source":"S22","rules":{},"incentives":["Capital, rental, recruitment and power incentives"],"watch":"Operating guidelines to follow; amounts not published."}],"conflicts":[{"id":"X1","question":"How many GCCs are in India?","facts":["F1","F2","F3","F4","F5","F6"],"why":"Mostly definitions and dates. Nasscom-Zinnov counts 2,117 parent companies and 3,728 physical centres in the same report. Brokers count office occupiers. Zinnov's own number jumps from 1,760+ (end-2025) to 2,117 (Mar 2026), which looks like a scope change, not a quarter of growth."},{"id":"X2","question":"How many new GCCs open each year?","facts":["F9","F10","F11","F12","F13"],"why":"Research firms land near 100-110 a year. The Finance Minister's 'nearly one a day' is a speech line, not a count."},{"id":"X3","question":"What is GCC attrition?","facts":["F17","F18"],"why":"Different samples. EY surveys GCC leaders; Zinnov tracks talent data. Plan for the higher figure in AI and cloud roles."},{"id":"X4","question":"What share of office leasing do GCCs take?","facts":["F19","F20","F21"],"why":"Each broker uses its own city set and decides differently whether flex seats used by GCCs count as GCC leasing."},{"id":"X5","question":"How many GCCs are in Bengaluru?","facts":["F33","F34","F35"],"why":"487 counts companies; 880+ and 900+ count centres."},{"id":"X6","question":"How many GCCs are in Hyderabad?","facts":["F40","F41","F42"],"why":"The state government counts 515; Zinnov counts 355+ centres at end-2025. Different dates and different definitions of a GCC."},{"id":"X7","question":"What does an EOR cost per employee?","facts":["F27","F28"],"why":"Both are vendors quoting their own prices. The gap is what an entrant has to negotiate blind."},{"id":"X8","question":"How long does setup take?","facts":["F24","F25","F26"],"why":"It depends on the model: EOR/BOT gets first hires in weeks, your own entity takes months. Every figure here comes from a firm that sells setup."},{"id":"X9","question":"How many mid-market GCCs are there?","facts":["F15","F16"],"why":"Two vintages of the same series: 480+ (Apr 2025) and 583 (Mar 2026)."}],"gccs":[{"name":"Costco","sector":"Retail","city":"hyderabad","status":"Announced","detail":"Technology, research and digital operations; 1,000+ professionals initial target","source":"S38","as_of":"2026-03"},{"name":"Eli Lilly","sector":"Pharma","city":"hyderabad","status":"Announced","detail":"AI, automation, software engineering; up to 1,500 people by 2026-27","source":"S38","as_of":"2026-03"},{"name":"Sanofi","sector":"Pharma","city":"hyderabad","status":"Expanding","detail":"€400 million investment; 2,600+ employees by 2026","source":"S38","as_of":"2026-03"},{"name":"HCA Healthcare","sector":"Healthcare","city":"hyderabad","status":"Announced","detail":"Hospital operations and healthcare technology; US$75 million investment","source":"S38","as_of":"2026-03"},{"name":"L'Oréal","sector":"Consumer goods","city":"hyderabad","status":"Announced","detail":"One of its largest global GCCs","source":"S38","as_of":"2026-03"},{"name":"Johnson & Johnson","sector":"Healthcare","city":"hyderabad","status":"Announced","detail":"Global healthcare operations, digital and enterprise support","source":"S38","as_of":"2026-03"},{"name":"Western Union (2nd centre)","sector":"Financial services","city":"hyderabad","status":"Announced","detail":"Platform engineering; BOT model with HCLTech; 400+ professionals","source":"S39","as_of":"2026"},{"name":"Qualcomm","sector":"Semiconductors","city":"bengaluru","status":"Leased","detail":"2.56 lakh sq ft at Bagmane Constellation, ORR, at ₹113/sq ft/month","source":"S25","as_of":"2025"}],"providers":[{"name":"ANSR","category":"Setup & BOT","claim":"Says it has set up 170 GCCs; plans 200 more in five years. MoU with Tamil Nadu.","source":"S41"},{"name":"Bhartiya Converge","category":"Real estate & enablement","claim":"Launched in Apr 2025 as a GCC enablement platform.","source":"S49"},{"name":"Cushman & Wakefield","category":"Real estate","claim":"GCC advisory practice offering services à la carte.","source":"S46"},{"name":"Deloitte India + Embark","category":"Advisory + operations","claim":"Alliance (Aug 2025): Deloitte on strategy, entity and tax; Embark on facilities and operations. Targets mid-market firms.","source":"S43"},{"name":"GoodWorks (Sansovi)","category":"GCC-as-a-service","claim":"MoU with KDEM (Karnataka, Aug 2026) targeting 50 new GCCs.","source":"S45"},{"name":"Inductus","category":"Setup & BOT","claim":"BOT, company-owned partner-operated and modular models. MoU with Gujarat DST (Apr 2026) for mid-sized MNCs.","source":"S42"},{"name":"JLL + Aeka Advisors","category":"Real estate + advisory","claim":"Partnership to serve global companies setting up GCCs.","source":"S47"},{"name":"Quess (Origint)","category":"Staffing & workplace","claim":"Division launched Jun 2025: workforce, workplace and workload as a service.","source":"S44"},{"name":"TeamLease","category":"Staffing","claim":"Partnership with Invest UP on GCC talent.","source":"S48"},{"name":"Wisemonk","category":"EOR","claim":"EOR from US$99 per employee per month (its own published price).","source":"S34"},{"name":"Zinnov","category":"Advisory & research","claim":"Publishes the Nasscom-Zinnov GCC landscape and sells setup advisory.","source":"S1"}],"assumptions":{"sqft_per_seat":{"value":100,"label":"100 sq ft per seat (Kosh planning assumption, not sourced)"},"statutory_load":{"value":0.125,"label":"Statutory benefits add 10-15% to salary (vendor estimate, S32); midpoint 12.5%","source":"S32"},"salary_proxy":{"label":"Software engineer median used as the average cost per head. Real mixes vary a lot by role and seniority.","source":"S28"},"rent_fallback":{"low":50,"high":100,"label":"Grade A tier-1 rent ₹50-100/sq ft/month (vendor estimate, S32) where no city figure exists","source":"S32"},"inr_per_usd":{"value":88,"label":"₹88 per US$ (Kosh planning rate)"}}}</script>
<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById("kosh-data").textContent);
var FACT = {}, SRC = {}, CONF_OF = {}, CITY = {}, STATE = {};
D.facts.forEach(function(f){FACT[f.id]=f;});
D.sources.forEach(function(s){SRC[s.id]=s;});
D.conflicts.forEach(function(x){x.facts.forEach(function(id){CONF_OF[id]=x.id;});});
D.cities.forEach(function(c){CITY[c.id]=c;});
D.states.forEach(function(s){STATE[s.id]=s;});
var A = D.assumptions;

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function $(sel,el){return (el||document).querySelector(sel);}
function find(subject,metric){return D.facts.filter(function(f){return f.subject===subject&&f.metric===metric;});}
function first(subject,metric){return find(subject,metric)[0]||null;}
function factStatus(f){
  if(CONF_OF[f.id]) return "conflict";
  var s=SRC[f.source]; if(!s) return "stale";
  if(s.kind==="vendor") return "stale";
  var y=parseInt(String(f.as_of).slice(0,4),10), m=parseInt(String(f.as_of).slice(5,7)||"6",10);
  var months=(2026-y)*12+(10-m); if(months>12) return "stale";
  return "sourced";
}
var STATUS_WORD={sourced:"Sourced",conflict:"Sources disagree",stale:"Single source or dated",verified:"Verified"};
function dot(fid){var f=FACT[fid]; if(!f) return ""; var st=factStatus(f); var s=SRC[f.source];
  return '<button class="dot dot--'+st+'" data-fact="'+fid+'" aria-label="'+esc(STATUS_WORD[st]+": "+(s?s.publisher:"")+", "+f.as_of)+'" title="'+esc((s?s.publisher:"")+" · "+f.as_of)+'"></button>';}
function srcDot(sid){var s=SRC[sid]; if(!s) return ""; return '<button class="dot'+(s.kind==="vendor"?" dot--stale":"")+'" data-src="'+sid+'" aria-label="Source: '+esc(s.publisher)+'" title="'+esc(s.publisher+" · "+s.date)+'"></button>';}
function srcLine(fid){var f=FACT[fid]; if(!f) return ""; var s=SRC[f.source]; return esc(s.publisher)+" · "+esc(f.as_of)+(f.definition?" · "+esc(f.definition):"");}
function fmtVal(f){ if(typeof f.value==="number"){ return f.value.toLocaleString("en-IN"); } return esc(f.value); }
function safeGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function safeSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

/* ---------- plan state ---------- */
var EXAMPLE_PLAN={company:"Nordlicht Health (example)",revenue:"100m-1b",rank:"other",functions:["engineering","data"],y1:60,y3:150,model:"eor",cities:["bengaluru","hyderabad","pune","chennai"],timeline:"First hires by Q2 2027",notes:"PE-backed US health-tech firm. Wants an engineering and data team, then own entity once past ~75 people."};
var plan=JSON.parse(JSON.stringify(EXAMPLE_PLAN)); var planIsExample=true;
try{var saved=safeGet("kosh-plan"); if(saved){plan=JSON.parse(saved); planIsExample=!!plan._example;}}catch(e){}
function savePlan(){safeSet("kosh-plan",JSON.stringify(plan));}
var FUNCS=[["engineering","Engineering"],["data","Data & AI"],["finance","Finance & accounting"],["operations","Operations"],["support","Customer support / BPO"],["sales","Sales"]];
var MODEL_SHORT={eor:"an EOR, own entity later",bot:"a BOT partner",own:"its own entity"};
var MODELS=[["eor","Start on an EOR, own entity later"],["bot","Build-operate-transfer (BOT) partner"],["own","Own entity from day one"]];
var RANKS=[["g2000","Forbes Global 2000"],["f1000","Fortune 1000"],["other","Neither"]];
var REVS=[["lt100m","Under US$100M"],["100m-1b","US$100M to 1B"],["gt1b","Over US$1B"]];
function label(list,v){for(var i=0;i<list.length;i++) if(list[i][0]===v) return list[i][1]; return v;}

/* ---------- cost model ---------- */
function rentFor(cityId){
  if(cityId==="hyderabad"){var f=first("hyderabad","Office rent, SBD"); return {lo:70,hi:95,fid:f&&f.id,note:"Hyderabad SBD range"};}
  if(cityId==="bengaluru"){var g=first("bengaluru","Office rent (single transaction)"); return {lo:A.rent_fallback.low,hi:113,fid:g&&g.id,note:"Tier-1 range up to a recorded ORR deal at ₹113"};}
  var fb=first("india","Grade A office rent, tier-1 cities");
  if(CITY[cityId]&&CITY[cityId].tier===2) return null;
  return {lo:A.rent_fallback.low,hi:A.rent_fallback.high,fid:fb&&fb.id,note:"No city figure; tier-1 vendor range"};
}
function costFor(cityId,p){
  var sal=first(cityId,"Software engineer median salary"); var rent=rentFor(cityId);
  if(!sal||!rent) return null;
  var heads=Math.max(1,Number(p.y1)||1);
  var payroll=heads*sal.num*(1+A.statutory_load.value)/100; // ₹ crore
  var sqft=heads*A.sqft_per_seat.value;
  var rentLo=sqft*rent.lo*12/1e7, rentHi=sqft*rent.hi*12/1e7;
  var eorLo=0,eorHi=0;
  if(p.model==="eor"){eorLo=heads*99*12*A.inr_per_usd.value/1e7; eorHi=heads*599*12*A.inr_per_usd.value/1e7;}
  return {sal:sal,rent:rent,payroll:payroll,rentLo:rentLo,rentHi:rentHi,eorLo:eorLo,eorHi:eorHi,lo:payroll+rentLo+eorLo,hi:payroll+rentHi+eorHi};
}
function cr(n){return "₹"+(n>=10?n.toFixed(0):n.toFixed(1))+" cr";}
function usdm(n){return "US$"+(n*1e7/A.inr_per_usd.value/1e6).toFixed(1)+"M";}

/* ---------- incentive engine ---------- */
function evalState(st,p,cityId){
  var r=st.rules||{}, reasons=[], verdict="likely";
  function down(v){var order={likely:0,check:1,no:2,none:3}; if(order[v]>order[verdict]) verdict=v;}
  if(r.no_policy){ return {verdict:"none",reasons:["No notified GCC policy to claim from today. "+st.watch]}; }
  if(r.ownership && p.model!=="own"){ down("no"); reasons.push("Only wholly owned units qualify. Your plan uses "+(p.model==="bot"?"a BOT partner":"an EOR")+"."); }
  if(r.min_employees){ if(p.y1<r.min_employees && p.y3>=r.min_employees){down("check"); reasons.push("Needs "+r.min_employees+"+ employees. You reach that in year 3, not year 1.");} else if(p.y3<r.min_employees){down("no"); reasons.push("Needs "+r.min_employees+"+ employees; your plan stays below that.");} }
  if(r.min_employees_noida){ var th=(cityId==="ncr")?r.min_employees_noida:r.min_employees_other; if(p.y3<th){down("check"); reasons.push("Needs "+th+" staff (or a capital threshold) in "+(cityId==="ncr"?"Noida/Ghaziabad":"UP outside Noida")+". Your year-3 plan is "+p.y3+".");} }
  if(r.parent_rank && r.parent_rank.indexOf(p.rank)<0){ down("no"); reasons.push("Parent must be Fortune 1000 or Forbes G2000."); }
  if(r.excluded_functions){ var bad=p.functions.filter(function(f){return f==="support"||f==="sales";}); if(bad.length){ down(p.functions.length===bad.length?"no":"check"); reasons.push("BPO, call-centre and pure sales units are excluded. Keep those functions out of the claiming unit."); } }
  if(r.first_n){ down("check"); reasons.push("The richest incentives go to the first "+r.first_n+" large GCCs. Ask the state how many slots are left."); }
  if(r.dated){ down("check"); reasons.push("Scheme figures date from Feb 2024 and run to Mar 2027. Confirm they still apply."); }
  if(st.id==="KA" && cityId==="bengaluru"){ reasons.push("The 'Beyond Bengaluru' package does not apply inside Bengaluru."); }
  if(p.model==="eor" && verdict!=="no"){ down("check"); reasons.push("On an EOR your staff sit on the provider's payroll. Incentives are normally claimed by your own registered unit, so count on them only after you incorporate. (Kosh reading of the policies, not legal advice.)"); }
  if(st.status.indexOf("not verified")>=0||st.status.indexOf("pending")>=0){ down("check"); reasons.push(st.watch); }
  reasons=reasons.filter(function(v,i,a){return a.indexOf(v)===i;});
  if(!reasons.length) reasons.push("Your plan meets the published thresholds.");
  return {verdict:verdict,reasons:reasons};
}
function statesFor(cityId){var c=CITY[cityId]; var out=[STATE[c.state]]; if(c.alt_state) out.push(STATE[c.alt_state]); return out.filter(Boolean);}
var VERDICT={likely:["chip--ok","Likely eligible"],check:["chip--warn","Check first"],no:["chip--no","Not eligible"],none:["chip--none","No policy yet"]};
function verdictChip(v){var x=VERDICT[v]; return '<span class="chip '+x[0]+'">'+x[1]+'</span>';}
function bestVerdict(cityId,p){var order={likely:0,check:1,none:2,no:3},best=null; statesFor(cityId).forEach(function(st){var e=evalState(st,p,cityId); if(!best||order[e.verdict]<order[best.verdict]) best={verdict:e.verdict,state:st,e:e};}); return best;}

/* ---------- routing ---------- */
var VIEWS=[["plan","Your plan"],["cities","Compare cities"],["incentives","Incentives"],["ask","Ask Kosh"],["conflicts","Where sources disagree"],["providers","Providers"],["brief","Decision brief"],["sources","Sources"]];
var view="plan"; var h=(location.hash||"").replace("#",""); VIEWS.forEach(function(v){if(v[0]===h) view=h;});
function navHTML(){return VIEWS.map(function(v){var n=v[0]==="conflicts"?D.conflicts.length:(v[0]==="sources"?D.sources.length:(v[0]==="providers"?D.providers.length:"")); return '<button data-view="'+v[0]+'"'+(v[0]===view?' aria-current="page"':'')+'><span>'+v[1]+'</span>'+(n!==""?'<span class="n">'+n+'</span>':'')+'</button>';}).join("");}
function go(v){view=v; try{history.replaceState(null,"","#"+v);}catch(e){} render(); window.scrollTo(0,0);}
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-view]"); if(b){go(b.getAttribute("data-view")); return;}
  var d=ev.target.closest("[data-fact]"); if(d){openFact(d.getAttribute("data-fact")); return;}
  var s=ev.target.closest("[data-src]"); if(s){openSource(s.getAttribute("data-src")); return;}
  var x=ev.target.closest("[data-conflict]"); if(x){go("conflicts"); setTimeout(function(){var el=document.getElementById(x.getAttribute("data-conflict")); if(el) el.scrollIntoView({block:"start"});},30); return;}
  if(ev.target.closest(".scrim")||ev.target.closest("[data-close]")) closeDrawer();
});
document.addEventListener("keydown",function(e){if(e.key==="Escape") closeDrawer();});
window.addEventListener("hashchange",function(){var h=(location.hash||"").replace("#",""); VIEWS.forEach(function(v){if(v[0]===h&&h!==view){view=h; render();}});});

/* ---------- drawer ---------- */
function closeDrawer(){$("#drawerRoot").innerHTML="";}
function openFact(fid){var f=FACT[fid]; if(!f) return; var s=SRC[f.source]; var st=factStatus(f); var x=CONF_OF[fid];
  $("#drawerRoot").innerHTML='<div class="scrim"></div><aside class="drawer fade" role="dialog" aria-label="Source"><div class="row" style="justify-content:space-between"><span class="eyebrow">'+esc(STATUS_WORD[st])+'</span><button class="btn btn--quiet" data-close>Close</button></div>'+
  '<div class="muted small">'+esc(f.metric)+(f.subject!=="india"?" · "+esc(CITY[f.subject]?CITY[f.subject].name:f.subject):" · India")+'</div><div class="v">'+fmtVal(f)+' <span class="small muted" style="font-family:var(--sans)">'+esc(f.unit)+'</span></div>'+
  (f.definition?'<p class="small"><b>Counts:</b> '+esc(f.definition)+'</p>':'')+
  '<div class="card stack" style="padding:16px;gap:6px"><div class="src">'+esc(s.kind.toUpperCase())+' · '+esc(s.date)+'</div><h3>'+esc(s.title)+'</h3><div class="small">'+esc(s.publisher)+'</div>'+(s.sells_services?'<div class="small" style="color:var(--conflict)">Interest to declare: '+esc(s.sells_services)+'</div>':'<div class="small muted">No GCC services sold by this source.</div>')+'<a class="small" href="'+esc(s.url)+'" target="_blank" rel="noopener">Open the source</a></div>'+
  (x?'<button class="btn" data-conflict="'+x+'">See the disagreement</button>':'')+
  '<p class="small muted">Fact '+fid+'. Kosh stores the figure exactly as the source states it, with its date and definition.</p></aside>';
  var c=$(".drawer [data-close]"); if(c) c.focus();
}
function openSource(sid){var s=SRC[sid]; if(!s) return; var used=D.facts.filter(function(f){return f.source===sid;});
  $("#drawerRoot").innerHTML='<div class="scrim"></div><aside class="drawer fade" role="dialog" aria-label="Source"><div class="row" style="justify-content:space-between"><span class="eyebrow">Source '+sid+'</span><button class="btn btn--quiet" data-close>Close</button></div><h2>'+esc(s.title)+'</h2><div class="src">'+esc(s.publisher)+' · '+esc(s.date)+' · '+esc(s.kind)+'</div>'+(s.sells_services?'<div class="small" style="color:var(--conflict)">Interest to declare: '+esc(s.sells_services)+'</div>':'')+'<a class="small" href="'+esc(s.url)+'" target="_blank" rel="noopener">Open the source</a><div class="stack" style="gap:8px">'+(used.length?'<div class="eyebrow">Figures Kosh takes from it</div>'+used.map(function(f){return '<div class="small">'+esc(f.metric)+': <b class="mono">'+fmtVal(f)+'</b> '+esc(f.unit)+'</div>';}).join(""):'<div class="small muted">Used for policy text, providers or announcements.</div>')+'</div></aside>';
  var c=$(".drawer [data-close]"); if(c) c.focus();
}

/* ---------- views ---------- */
function exampleBanner(){return planIsExample?'<div class="banner"><span class="dot" style="cursor:default;margin:3px 0 0"></span><div>This is an <b>example plan</b> for a fictional mid-market company so you can see Kosh working. Change any field, or describe your own plan and let Kosh read it.</div></div>':'';}
function vPlan(){
  var p=plan;
  var cities=D.cities.map(function(c){return '<label><input type="checkbox" name="city" value="'+c.id+'"'+(p.cities.indexOf(c.id)>=0?" checked":"")+'> '+esc(c.name)+'</label>';}).join("");
  var funcs=FUNCS.map(function(f){return '<label><input type="checkbox" name="func" value="'+f[0]+'"'+(p.functions.indexOf(f[0])>=0?" checked":"")+'> '+f[1]+'</label>';}).join("");
  function sel(id,list,v){return '<select id="'+id+'">'+list.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===v?" selected":"")+'>'+o[1]+'</option>';}).join("")+'</select>';}
  var ranked=p.cities.map(function(c){return {c:c,cost:costFor(c,p),v:bestVerdict(c,p)};});

}

  var p=plan, b=briefData(), lead=b.priced[0], second=b.priced[1];
  var verdict=lead?("Lowest run cost: "+lead.c.name+(second?" then "+second.c.name:"")+". Settle the incentive questions before you sign a lease."):"Kosh needs more data before it can price these cities.";
  var html='<div class="brief fade" id="briefDoc"><div class="row" style="justify-content:space-between"><span class="eyebrow">Decision brief · '+esc((function(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})(new Date()))+'</span><span class="src">Dataset as of '+esc(D.meta.as_of)+'</span></div>'+
  '<h1 style="margin-top:10px">'+esc(p.company)+' in India</h1><p class="verdictline">'+esc(verdict)+'</p>'+
  '<h2>The plan</h2><p class="small">'+p.y1+' people in year 1, '+p.y3+' by year 3 · '+esc(p.functions.map(function(f){return label(FUNCS,f);}).join(", "))+' · '+esc(label(MODELS,p.model))+' · '+esc(label(REVS,p.revenue))+' parent · '+esc(p.timeline)+'</p>'+
  '<h2>Cities</h2><div class="tablewrap" style="margin-top:8px"><table style="min-width:560px"><thead><tr><th>City</th><th>Year-1 run cost</th><th>Engineer median</th><th>Incentives</th></tr></thead><tbody>'+
  b.rows.map(function(r){return '<tr><td class="city">'+esc(r.c.name)+'</td><td class="mono">'+(r.cost?cr(r.cost.lo)+" to "+cr(r.cost.hi):"Not enough data")+'</td><td class="mono">'+(r.sal?"₹"+r.sal.num+"L"+dot(r.sal.id):"No figure")+'</td><td>'+(r.v?verdictChip(r.v.verdict)+' <span class="src">'+esc(r.v.state.name)+'</span>':'')+'</td></tr>';}).join("")+'</tbody></table></div>'+
  '<h2>Kosh\'s reading</h2><div id="briefAI" class="answer small">'+(briefAI?renderAnswer(briefAI):'<p class="muted">Add a written summary drawn only from the figures above.</p>')+'</div>'+
  '<h2>Numbers to treat with care</h2><ul class="small" style="padding-left:18px;display:flex;flex-direction:column;gap:4px">'+["X3","X7","X8"].map(function(id){var x=D.conflicts.filter(function(c){return c.id===id;})[0]; return '<li><b>'+esc(x.question)+'</b> '+esc(x.why)+' <button class="cite" data-conflict="'+id+'">'+id+'</button></li>';}).join("")+'</ul>'+
  '<h2>Questions to settle before you commit</h2><ol class="small" style="padding-left:18px;display:flex;flex-direction:column;gap:4px">'+briefQuestions().map(function(q){return '<li>'+esc(q)+'</li>';}).join("")+'</ol>'+
  '<p class="src" style="margin-top:24px">Costs are estimates from published medians and ranges, using the assumptions shown in Compare cities. Not legal, tax or investment advice. Every figure links to its source in Kosh.</p></div>';
  return '<div class="eyebrow">Step 4 · Decision brief</div><h1>One page your board can read.</h1><p class="lede">Built from your plan and Kosh\'s sourced figures. Share it with your CFO, or take it into your first provider conversations.</p>'+
  '<div class="section"><div class="row"><button class="btn btn--primary" id="briefAIBtn">'+(briefAI?"Rewrite the summary":"Write the summary")+'</button><button class="btn" id="dlBrief">Download as Markdown</button><button class="btn" id="copyBrief">Copy text</button><span class="thinking" id="briefStatus"></span></div>'+html+'</div>';
}
function briefQuestions(){var q=[]; var p=plan;
  p.cities.forEach(function(cid){statesFor(cid).forEach(function(st){var e=evalState(st,p,cid); if(e.verdict==="check"){var r=e.reasons.filter(function(x){return x.indexOf("On an EOR")<0;})[0]; if(r) q.push(st.name+": "+r);}});});
  if(p.model==="eor") q.push("When will you incorporate? Kosh's reading is that most state incentives start only once your own unit is registered.");
  q.push("Get two EOR or BOT quotes in writing: published prices run from US$99 to US$599 per person per month.");
  q.push("Ask every provider for two client references from the last 24 months, in your size band.");
  return q.filter(function(v,i,a){return a.indexOf(v)===i;}).slice(0,7);}
function briefMarkdown(){var p=plan,b=briefData();
  var md="# "+p.company+" in India: decision brief\n\nDataset as of "+D.meta.as_of+". Built with Kosh.\n\n## Plan\n"+p.y1+" people in year 1, "+p.y3+" by year 3. Functions: "+p.functions.map(function(f){return label(FUNCS,f);}).join(", ")+". Model: "+label(MODELS,p.model)+". Timeline: "+p.timeline+".\n\n## Cities\n| City | Year-1 run cost | Engineer median | Incentives |\n|---|---|---|---|\n"+
  b.rows.map(function(r){return "| "+r.c.name+" | "+(r.cost?cr(r.cost.lo)+" to "+cr(r.cost.hi):"Not enough data")+" | "+(r.sal?"₹"+r.sal.num+"L (Flexiple Talent Market, Aug 2026)":"No figure")+" | "+(r.v?VERDICT[r.v.verdict][1]+" ("+r.v.state.name+")":"")+" |";}).join("\n")+
  (briefAI?"\n\n## Kosh's reading\n"+briefAI.replace(/\[(F\d+)\]/g,function(m,id){var f=FACT[id]; return f?" ("+SRC[f.source].publisher+", "+f.as_of+")":"";}):"")+
  "\n\n## Questions to settle\n"+briefQuestions().map(function(q,i){return (i+1)+". "+q;}).join("\n")+
  "\n\n## Sources\n"+D.sources.filter(function(s){return ["S28","S32","S33","S34","S26","S27"].indexOf(s.id)>=0||p.cities.some(function(c){return statesFor(c).some(function(st){return st.source===s.id;});});}).map(function(s){return "- "+s.publisher+", "+s.title+" ("+s.date+"): "+s.url;}).join("\n")+
  "\n\nCosts are estimates. Not legal, tax or investment advice.\n"; return md;}
async function writeBriefAI(){
  var st=$("#briefStatus"), btn=$("#briefAIBtn"); var sample=null; try{sample=await window.claude.use("sample");}catch(e){}
  if(!sample){st.textContent="The assistant isn't available in this view. The rest of the brief still works."; return;}
  btn.disabled=true; st.textContent="Thinking…";
  var prompt=RULES+datasetForPrompt()+"\n\nUSER'S PLAN:\n"+planSummary()+"\n\nTASK: Write the 'Kosh's reading' section of a one-page decision brief for this plan: 120 to 160 words, plain prose in two short paragraphs. Paragraph 1: which cities to shortlist and why, using the computed costs and incentive verdicts. Paragraph 2: the biggest uncertainty in the numbers and what to verify. Cite fact ids for every figure.";
  try{var r=await sample(prompt,{modelTier:"default",onText:function(u){st.textContent=""; var el=$("#briefAI"); if(el) el.innerHTML=renderAnswer(u.text);}}); briefAI=r.text; render();}
  catch(e){btn.disabled=false; st.textContent=(e&&e.code==="not_granted")?"Allow Kosh to use Claude to write the summary.":"Couldn't write the summary. Try again.";}
}
/* ---------- sources ---------- */
function vSources(){
  var rows=D.sources.slice().sort(function(a,b){return String(b.date).localeCompare(String(a.date));}).map(function(s){var n=D.facts.filter(function(f){return f.source===s.id;}).length;
    return '<tr><td class="mono small">'+s.id+'</td><td><b>'+esc(s.publisher)+'</b><div class="small">'+esc(s.title)+'</div></td><td class="mono small">'+esc(s.date)+'</td><td class="small">'+esc(s.kind)+'</td><td class="small" style="color:'+(s.sells_services?'var(--conflict)':'var(--ink-muted)')+'">'+(s.sells_services?esc(s.sells_services):"None known")+'</td><td class="mono small">'+n+'</td><td><a class="small" href="'+esc(s.url)+'" target="_blank" rel="noopener">Open</a></td></tr>';}).join("");
  var conflicted=D.sources.filter(function(s){return s.sells_services;}).length;
  return '<div class="eyebrow">Sources</div><h1>Every source, and what it sells.</h1><p class="lede">'+conflicted+' of the '+D.sources.length+' sources behind this prototype belong to firms that also sell GCC services. Kosh still uses them, and tells you each time.</p>'+
  '<div class="section"><div class="tablewrap"><table><thead><tr><th>ID</th><th>Source</th><th>Date</th><th>Type</th><th>Interest to declare</th><th>Figures</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

/* ---------- render ---------- */
function render(){
  $("#nav").innerHTML=navHTML(); $("#navm").innerHTML=navHTML();
  $("#foot").innerHTML="Prototype · dataset "+esc(D.meta.as_of)+"<br>"+D.facts.length+" figures · "+D.sources.length+" sources";
  var m=$("#main");
  m.innerHTML={plan:vPlan,cities:vCities,incentives:vIncentives,ask:vAsk,conflicts:vConflicts,providers:vProviders,brief:vBrief,sources:vSources}[view]();
  wire();
}
function wire(){
  var b;
  if((b=$("#savePlan"))) b.onclick=function(){readForm(); render(); var s=$("#planStatus"); if(s) s.textContent="Updated.";};
  if((b=$("#resetPlan"))) b.onclick=function(){plan=JSON.parse(JSON.stringify(EXAMPLE_PLAN)); plan._example=true; planIsExample=true; savePlan(); render();};
  if((b=$("#readPlan"))) b.onclick=readPlanAI;
  var f=$("#askForm"); if(f){ f.onsubmit=function(e){e.preventDefault(); var v=$("#askBox").value; ask(v);}; $("#askBox").onkeydown=function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault(); ask(this.value);}}; $("#stopBtn").onclick=function(){if(asking) asking.abort();}; }
  [].forEach.call(document.querySelectorAll("[data-suggest]"),function(x){x.onclick=function(){ask(x.getAttribute("data-suggest"));};});
  [].forEach.call(document.querySelectorAll("[data-cat]"),function(x){x.onclick=function(){provFilter=x.getAttribute("data-cat"); render();};});
  if((b=$("#introBtn"))) b.onclick=function(){introSent=true; render();};
  if((b=$("#briefAIBtn"))) b.onclick=writeBriefAI;
  if((b=$("#dlBrief"))) b.onclick=async function(){var st=$("#briefStatus"); var dl=null; try{dl=await window.claude.use("downloads");}catch(e){}
    if(!dl){st.textContent="Downloads aren't available here. Use Copy text instead."; return;}
    try{await dl.save({filename:(plan.company||"kosh").replace(/[^a-z0-9]+/gi,"-").toLowerCase()+"-india-brief.md",data:briefMarkdown()}); st.textContent="Saved.";}catch(e){st.textContent=e&&e.code==="declined"?"Download cancelled.":"Couldn't save the file. Use Copy text instead.";}};
  if((b=$("#copyBrief"))) b.onclick=function(){var st=$("#briefStatus"); var t=briefMarkdown(); try{navigator.clipboard.writeText(t).then(function(){st.textContent="Copied.";},function(){fallbackCopy(t); st.textContent="Text selected. Press Ctrl+C or Cmd+C.";});}catch(e){fallbackCopy(t); st.textContent="Text selected. Press Ctrl+C or Cmd+C.";}};
}
function fallbackCopy(t){var ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); setTimeout(function(){ta.remove();},4000);}
async function readPlanAI(){
  var st=$("#planStatus"), txt=$("#planText").value.trim(); if(!txt){st.textContent="Write a sentence or two about your plan first."; return;}
  var sample=null; try{sample=await window.claude.use("sample");}catch(e){}
  if(!sample){st.textContent="The assistant isn't available here. Fill in the form instead."; return;}
  st.textContent="Reading your plan…"; $("#readPlan").disabled=true;
  var prompt="Extract a GCC setup plan from the text below. Reply with only a JSON object with these keys: company (string), revenue (one of lt100m, 100m-1b, gt1b, or null), rank (one of g2000, f1000, other, or null), functions (array from: engineering, data, finance, operations, support, sales), y1 (integer headcount in year 1 or null), y3 (integer headcount in year 3 or null), model (one of eor, bot, own, or null), cities (array from: "+D.cities.map(function(c){return c.id+" ("+c.name+")";}).join(", ")+"), timeline (string or null). Use null when the text doesn't say. Example: {\"company\":\"Acme\",\"revenue\":\"100m-1b\",\"rank\":\"other\",\"functions\":[\"engineering\"],\"y1\":40,\"y3\":120,\"model\":\"eor\",\"cities\":[\"pune\"],\"timeline\":\"2027\"}\n\nTEXT:\n"+txt.slice(0,4000);
  try{var j=await sample.json(prompt,{modelTier:"quick"});
    if(j&&typeof j==="object"){ if(j.company) plan.company=String(j.company); if(j.revenue&&REVS.some(function(r){return r[0]===j.revenue;})) plan.revenue=j.revenue; if(j.rank&&RANKS.some(function(r){return r[0]===j.rank;})) plan.rank=j.rank;
      if(Array.isArray(j.functions)&&j.functions.length) plan.functions=j.functions.filter(function(f){return FUNCS.some(function(x){return x[0]===f;});});
      if(Number(j.y1)>0) plan.y1=Math.round(Number(j.y1)); if(Number(j.y3)>0) plan.y3=Math.max(plan.y1,Math.round(Number(j.y3))); else plan.y3=Math.max(plan.y3,plan.y1);
      if(j.model&&MODELS.some(function(m){return m[0]===j.model;})) plan.model=j.model;
      if(Array.isArray(j.cities)){var cs=j.cities.filter(function(c){return CITY[c];}); if(cs.length) plan.cities=cs;}
      if(j.timeline) plan.timeline=String(j.timeline);
      planIsExample=false; plan._example=false; savePlan(); render(); var s2=$("#planStatus"); if(s2) s2.textContent="Done. Check the fields below and adjust anything Kosh got wrong.";
      var pt=$("#planText"); if(pt) pt.value=txt; }
  }catch(e){ st.textContent=(e&&e.code==="not_granted")?"Allow Kosh to use Claude, or fill in the form.":"Kosh couldn't read that. Fill in the form instead."; $("#readPlan").disabled=false; }
}
render();
})();
</script>
